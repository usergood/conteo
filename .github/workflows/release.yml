name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Check version matches VERSION file
        run: |
          file_version="$(cat VERSION | tr -d '[:space:]')"
          if [ "$file_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "VERSION file ($file_version) does not match tag (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: conteo:smoke

      - name: Smoke test (fail rather than publish a broken image)
        run: |
          docker run -d --name conteo-smoke -e DATA_DIR=/tmp/conteo-smoke \
            -e AUTH_MODE=dev -e DEV_AUTH_TOKEN=smoke-token \
            -e APP_BASE_URL=http://127.0.0.1:3000 -p 3300:3000 conteo:smoke
          trap 'docker rm -f conteo-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3300/api/health >/dev/null 2>&1; then
              echo "smoke ok"
              exit 0
            fi
            sleep 1
          done
          docker logs conteo-smoke
          echo "smoke failed" >&2
          exit 1

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/usergood/conteo:${{ steps.version.outputs.version }}
            ghcr.io/usergood/conteo:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Conteo ${{ github.ref_name }}
          generate_release_notes: true
