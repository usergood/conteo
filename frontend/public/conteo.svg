<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Main Dynamic Arc Gradient (Emerald to Cyan) -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Secondary Arc Gradient (Indigo to Cyan) -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Accent Bar Gradient -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border/Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- Background Grid Glow Overlay -->
  <circle cx="256" cy="256" r="180" fill="#10B981" opacity="0.06" filter="blur(30px)"/>
  <circle cx="340" cy="180" r="120" fill="#6366F1" opacity="0.08" filter="blur(30px)"/>

  <!-- Main Graphic Group -->
  <g filter="url(#dropShadow)">
    
    <!-- Financial Growth Bars (Centered inside "C") -->
    <!-- Bar 1 (Left / Small) -->
    <rect x="200" y="270" width="22" height="60" rx="11" fill="url(#barGrad1)"/>
    <!-- Bar 2 (Middle / Medium) -->
    <rect x="238" y="220" width="22" height="110" rx="11" fill="url(#barGrad2)"/>
    <!-- Bar 3 (Right / Tall) -->
    <rect x="276" y="170" width="22" height="160" rx="11" fill="url(#barGrad3)"/>

    <!-- FX Node Dots -->
    <circle cx="211" cy="255" r="4" fill="#34D399"/>
    <circle cx="249" cy="205" r="4" fill="#60A5FA"/>
    <circle cx="287" cy="155" r="4" fill="#818CF8"/>

    <!-- Dynamic "C" Outer Global Exchange Ring (Top Arc) -->
    <path d="M 345 165 
             A 125 125 0 1 0 345 347" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="32" 
          stroke-linecap="round"
          filter="url(#glow)"/>

    <!-- Currency Exchange Intersecting Swoosh (Lower Accenting Arc) -->
    <path d="M 330 365 
             C 270 415, 150 395, 120 310" 
          fill="none" 
          stroke="url(#secondaryGrad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          opacity="0.9"/>

    <!-- Global Connection / FX Node -->
    <circle cx="345" cy="165" r="10" fill="#06B6D4"/>
    <circle cx="345" cy="165" r="5" fill="#FFFFFF"/>

    <circle cx="345" cy="347" r="10" fill="#10B981"/>
    <circle cx="345" cy="347" r="5" fill="#FFFFFF"/>

  </g>
</svg>
